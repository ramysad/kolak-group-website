<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kolak Group</title>

    <!-- 1. Optimized Google Fonts Loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- 2. Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- 3. Stylesheets -->
    <link rel="stylesheet" href="css/design-system.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <!-- Header Component Placeholder -->
    <div data-component="header"></div>

    <main>
      <!-- Hero Component Placeholder -->
      <div data-component="hero"></div>

      <!-- About Us Preview Placeholder -->
      <div data-component="about-preview"></div>

      <!-- Video Showcase Placeholder (Replaces the hardcoded section) -->
      <div data-component="video-showcase"></div>

      <!-- Partners / Clients Section Placeholder -->
      <div data-component="partners-section"></div>

      <!-- News & Events Section Placeholder -->
      <div data-component="news-section"></div>
    </main>

    <!-- Footer Component Placeholder -->
    <div data-component="footer"></div>

    <!-- Component Loader & Controller Scripts -->
    <script src="js/component-loader.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
